  <style>
    :root { --ink:#2a2520; --teal:#2f6f66; --teal-d:#24574f; --brass:#c8964a; --terra:#a8573a; --sage:#6aa99d; --paper:#fbf8f2; --line:#cfc5b4; }
    @media (prefers-color-scheme: dark) { :root { --ink:#ebe4d6; --teal:#3b8378; --teal-d:#2f6f66; --paper:#f4efe6; } }
    .ink { stroke: var(--ink); } .txt { fill: var(--ink); } .accent { fill: var(--teal); }
    .in { opacity:0; transform-box:fill-box; animation: in .7s cubic-bezier(.2,.8,.2,1.15) forwards; }
    @keyframes in { from { opacity:0; transform:translateY(50px); } to { opacity:1; transform:none; } }
    .fade { opacity:0; animation: fade .6s ease forwards; } @keyframes fade { to { opacity:1; } }
    .draw { animation: draw .9s cubic-bezier(.6,0,.3,1) forwards; } @keyframes draw { to { stroke-dashoffset:0; } }
    .cupwrap { opacity:0; transform-box:fill-box; transform-origin:50% 50%; animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:none; } }
    .beat { transform-box:fill-box; transform-origin:50% 50%; animation: beat .6s ease-out infinite; }
    @keyframes beat { 0% { transform:scale(1.06); } 40%,100% { transform:scale(1); } }
    .wave { fill:none; stroke:var(--brass); stroke-width:8; stroke-linecap:round; opacity:0; transform-box:view-box; animation: wave 1.2s ease-out infinite; }
