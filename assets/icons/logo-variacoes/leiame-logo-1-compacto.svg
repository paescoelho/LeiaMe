<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 170 520 490" width="520" height="490" role="img" aria-label="LeiaMe">
  <title>LeiaMe</title>
  <style>
    :root { --ink:#2a2520; --teal:#2f6f66; --teal-d:#24574f; --brass:#c8964a; --terra:#a8573a; --sage:#6aa99d; --paper:#fbf8f2; --line:#cfc5b4; }
    @media (prefers-color-scheme: dark) { :root { --ink:#ebe4d6; --teal:#3b8378; --teal-d:#2f6f66; --paper:#f4efe6; } }
    .ink { stroke: var(--ink); } .txt { fill: var(--ink); } .accent { fill: var(--teal); }
    .rise { opacity:0; transform-box:fill-box; animation: rise .7s cubic-bezier(.2,.8,.2,1.15) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:none; } }
    .draw { animation: draw .9s cubic-bezier(.6,0,.3,1) forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    .cup { opacity:0; transform-box:fill-box; transform-origin:50% 50%; animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:none; } }
    .wave { fill:none; stroke:var(--brass); stroke-width:8; stroke-linecap:round; opacity:0; transform-box:view-box; animation: wave 1.8s ease-out infinite; }
    @keyframes wave { 0% { opacity:0; transform:scale(.85); } 30% { opacity:.95; } 100% { opacity:0; transform:scale(1.15); } }
    .name { opacity:0; transform-box:fill-box; animation: name .8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes name { from { opacity:0; transform:translateY(24px); letter-spacing:14px; } to { opacity:1; transform:none; letter-spacing:1px; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; } }

    .eq { transform-box:fill-box; transform-origin:50% 100%; animation: eq 1.6s ease-in-out infinite alternate; }
    @keyframes eq { to { transform:scaleY(1.06); } }
  </style>
  <g class="rise " style="animation-delay:0.05s"><g class="eq" style="animation-delay:1.2s">
    <rect x="196" y="330" width="64" height="170" rx="7" fill="var(--brass)"/>
    <rect x="196" y="330" width="64" height="170" rx="7" fill="none" class="ink" stroke-width="5"/>
    <path d="M208 358 H248 M208 370 H236 M208 470 H248" class="ink" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g></g>
  <g class="rise " style="animation-delay:0.2s"><g class="eq" style="animation-delay:1.5s;animation-duration:1.3s">
    <rect x="266" y="272" width="70" height="228" rx="7" fill="var(--terra)"/>
    <rect x="266" y="272" width="70" height="228" rx="7" fill="none" class="ink" stroke-width="5"/>
    <path d="M278 300 H324 M278 312 H312 M278 410 H324 M278 470 H312" class="ink" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g></g>
  <g class="rise " style="animation-delay:0.35s"><g class="eq" style="animation-delay:1.35s;animation-duration:1.8s">
    <rect x="342" y="304" width="62" height="196" rx="7" fill="var(--sage)"/>
    <rect x="342" y="304" width="62" height="196" rx="7" fill="none" class="ink" stroke-width="5"/>
    <path d="M354 332 H392 M354 344 H380 M354 470 H392" class="ink" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g></g>
  <path class="draw ink" style="stroke-dasharray:260;stroke-dashoffset:260;animation-delay:.45s" d="M180 506 H420" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path class="draw ink" style="stroke-dasharray:800;stroke-dashoffset:800;animation-delay:0.6s" d="M149 372 C 149 160, 451 160, 451 372" fill="none" stroke-width="14" stroke-linecap="round"/>
  <g class="cup" style="animation-delay:1.25s">
    <rect x="124" y="346" width="50" height="124" rx="24" fill="var(--teal)"/>
    <rect x="158" y="358" width="20" height="100" rx="9" fill="var(--teal-d)"/>
    <rect x="124" y="346" width="50" height="124" rx="24" fill="none" class="ink" stroke-width="5"/>
  </g>
  <g class="cup" style="animation-delay:1.35s">
    <rect x="426" y="346" width="50" height="124" rx="24" fill="var(--teal)"/>
    <rect x="422" y="358" width="20" height="100" rx="9" fill="var(--teal-d)"/>
    <rect x="426" y="346" width="50" height="124" rx="24" fill="none" class="ink" stroke-width="5"/>
  </g>
  <path class="wave" style="transform-origin:124px 408.0px;animation-delay:1.7s" d="M108 372.0 Q 89.6 408.0 108 444.0"/>
  <path class="wave" style="transform-origin:124px 408.0px;animation-delay:2.0s" d="M84 352.0 Q 44.0 408.0 84 464.0"/>
  <path class="wave" style="transform-origin:476px 408.0px;animation-delay:1.7s" d="M492 372.0 Q 510.4 408.0 492 444.0"/>
  <path class="wave" style="transform-origin:476px 408.0px;animation-delay:2.0s" d="M516 352.0 Q 556.0 408.0 516 464.0"/>
  <text class="name txt" style="animation-delay:1.55s" x="300" y="636" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="100" font-weight="600" letter-spacing="1">Leia<tspan class="accent">Me</tspan></text>
</svg>
