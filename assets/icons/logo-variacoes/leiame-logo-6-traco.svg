<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 170 520 490" width="520" height="490" role="img" aria-label="LeiaMe">
  <title>LeiaMe</title>
  <style>
    :root { --ink:#2a2520; --teal:#2f6f66; --teal-d:#24574f; --brass:#c8964a; --terra:#a8573a; --sage:#6aa99d; --paper:#fbf8f2; --line:#cfc5b4; }
    @media (prefers-color-scheme: dark) { :root { --ink:#ebe4d6; --teal:#3b8378; --teal-d:#2f6f66; --paper:#f4efe6; } }
    .ink { stroke: var(--ink); } .txt { fill: var(--ink); } .accent { fill: var(--teal); }
    .rise { opacity:0; transform-box:fill-box; animation: rise .7s cubic-bezier(.2,.8,.2,1.15) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:none; } }
    .draw { animation: draw .9s cubic-bezier(.6,0,.3,1) forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    .cup { opacity:0; transform-box:fill-box; transform-origin:50% 50%; animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:none; } }
    .wave { fill:none; stroke:var(--brass); stroke-width:8; stroke-linecap:round; opacity:0; transform-box:view-box; animation: wave 1.8s ease-out infinite; }
    @keyframes wave { 0% { opacity:0; transform:scale(.85); } 30% { opacity:.95; } 100% { opacity:0; transform:scale(1.15); } }
    .name { opacity:0; transform-box:fill-box; animation: name .8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes name { from { opacity:0; transform:translateY(24px); letter-spacing:14px; } to { opacity:1; transform:none; letter-spacing:1px; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; } }

    .ln { fill:none; stroke:var(--teal); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:900; stroke-dashoffset:900; animation: draw 1.1s ease-in-out forwards; }
    .fillIn { opacity:0; animation: fillIn .7s ease forwards; }
    @keyframes fillIn { to { opacity:1; } }
  </style>
  <g class="fillIn" style="animation-delay:2s">
    <rect x="196" y="330" width="64" height="170" rx="6" fill="var(--brass)" opacity=".35"/>
    <rect x="266" y="272" width="70" height="228" rx="6" fill="var(--terra)" opacity=".3"/>
    <rect x="342" y="304" width="62" height="196" rx="6" fill="var(--sage)" opacity=".4"/>
    <rect x="124" y="346" width="50" height="124" rx="25" fill="var(--teal)" opacity=".85"/>
    <rect x="426" y="346" width="50" height="124" rx="25" fill="var(--teal)" opacity=".85"/>
  </g>
  <path class="ln" style="animation-delay:0.0s" d="M196 500 V336 Q196 330 202 330 H254 Q260 330 260 336 V500"/>
  <path class="ln" style="animation-delay:0.25s" d="M266 500 V278 Q266 272 272 272 H330 Q336 272 336 278 V500"/>
  <path class="ln" style="animation-delay:0.5s" d="M342 500 V310 Q342 304 348 304 H398 Q404 304 404 310 V500"/>
  <path class="ln" style="animation-delay:0.7s" d="M176 506 H424"/>
  <path class="ln" style="animation-delay:0.85s" d="M149 398 C 149 160, 451 160, 451 398"/>
  <path class="ln" style="animation-delay:1.3s" d="M124 370 Q124 346 149 346 Q174 346 174 370 V446 Q174 470 149 470 Q124 470 124 446 Z"/>
  <path class="ln" style="animation-delay:1.4s" d="M426 370 Q426 346 451 346 Q476 346 476 370 V446 Q476 470 451 470 Q426 470 426 446 Z"/>
  <path class="ln" style="stroke-width:5;animation-delay:1.6s;stroke:var(--brass)" d="M210 360 H246 M210 372 H236 M280 300 H322 M280 312 H310 M356 334 H390 M356 346 H378"/>
  <path class="wave" style="transform-origin:124px 408px;animation-delay:2.2s" d="M108 372 Q 90 408 108 444"/>
  <path class="wave" style="transform-origin:476px 408px;animation-delay:2.2s" d="M492 372 Q 510 408 492 444"/>
  <text class="name txt" style="animation-delay:2.1s" x="300" y="636" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="100" font-weight="600" letter-spacing="1">Leia<tspan class="accent">Me</tspan></text>
</svg>
