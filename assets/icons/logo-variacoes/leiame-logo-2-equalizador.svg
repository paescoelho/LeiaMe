    <rect x="325" y="316" width="34" height="184" rx="6" fill="none" class="ink" stroke-width="5"/>
    <path d="M334 334 H350 M334 344 H350" class="ink" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  </g></g>
  <g class="rise" style="animation-delay:0.41s"><g class="bar" style="animation-duration:0.95s;animation-delay:1.35s">
