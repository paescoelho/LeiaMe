    <path d="M292 274 H308 M292 284 H308" class="ink" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  </g></g>
  <g class="rise" style="animation-delay:0.32s"><g class="bar" style="animation-duration:0.8s;animation-delay:1.55s">
