  <g class="cup" style="animation-delay:1.25s">
    <rect x="127" y="346" width="50" height="124" rx="24" fill="var(--teal)"/>
    <rect x="161" y="358" width="20" height="100" rx="9" fill="var(--teal-d)"/>
    <rect x="127" y="346" width="50" height="124" rx="24" fill="none" class="ink" stroke-width="5"/>
  </g>
  <g class="cup" style="animation-delay:1.35s">
