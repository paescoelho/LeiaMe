    <rect x="423" y="346" width="50" height="124" rx="24" fill="none" class="ink" stroke-width="5"/>
  </g>
  <path class="wave" style="transform-origin:127px 408.0px;animation-delay:1.7s" d="M111 372.0 Q 92.6 408.0 111 444.0"/>
