<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 170 480 490" width="480" height="490" role="img" aria-label="LeiaMe">
  <title>LeiaMe</title>
  <style>
    :root { --ink:#2a2520; --teal:#2f6f66; --teal-d:#24574f; --brass:#c8964a; --terra:#a8573a; --sage:#6aa99d; --paper:#fbf8f2; --line:#cfc5b4; }
    @media (prefers-color-scheme: dark) { :root { --ink:#ebe4d6; --teal:#3b8378; --teal-d:#2f6f66; --paper:#f4efe6; } }
    .ink { stroke: var(--ink); } .txt { fill: var(--ink); } .accent { fill: var(--teal); }
    .rise { opacity:0; transform-box:fill-box; animation: rise .7s cubic-bezier(.2,.8,.2,1.15) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:none; } }
    .draw { animation: draw .9s cubic-bezier(.6,0,.3,1) forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    .cup { opacity:0; transform-box:fill-box; transform-origin:50% 50%; animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:none; } }
    .wave { fill:none; stroke:var(--brass); stroke-width:8; stroke-linecap:round; opacity:0; transform-box:view-box; animation: wave 1.8s ease-out infinite; }
    @keyframes wave { 0% { opacity:0; transform:scale(.85); } 30% { opacity:.95; } 100% { opacity:0; transform:scale(1.15); } }
    .name { opacity:0; transform-box:fill-box; animation: name .8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes name { from { opacity:0; transform:translateY(24px); letter-spacing:14px; } to { opacity:1; transform:none; letter-spacing:1px; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; } }

    .flip { transform-box:view-box; transform-origin:300px 0; animation: flip 3.2s cubic-bezier(.6,0,.4,1) 1.1s infinite; }
    @keyframes flip { 0%,15% { transform:scaleX(1); } 55%,100% { transform:scaleX(-1); } }
    .flipShade { animation: shade 3.2s cubic-bezier(.6,0,.4,1) 1.1s infinite; }
    @keyframes shade { 0%,15% { fill:#e9e1d3; } 35% { fill:#d8cdb9; } 55%,100% { fill:#fbf8f2; } }
    .arc { fill:none; stroke-width:10; stroke-linecap:round; opacity:0; transform-box:view-box; transform-origin:300px 330px; animation: arc 2.4s ease-out infinite; }
    @keyframes arc { 0% { opacity:0; transform:scale(.6); } 25% { opacity:1; } 100% { opacity:0; transform:scale(1.25); } }
  </style>
  <g class="rise" style="animation-delay:.05s">
    <path d="M300 352 C 262 326, 214 320, 168 328 L 168 486 C 214 478, 262 484, 300 510 Z" fill="#fbf8f2" class="ink" stroke-width="5" stroke-linejoin="round"/>
    <path d="M300 352 C 338 326, 386 320, 432 328 L 432 486 C 386 478, 338 484, 300 510 Z" fill="#e9e1d3" class="ink" stroke-width="5" stroke-linejoin="round"/>
    <path d="M192 372 C 222 366, 252 368, 278 378 M192 404 C 222 398, 252 400, 278 410 M192 436 C 222 430, 252 432, 278 442" stroke="var(--line)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g class="flip"><path class="flipShade ink" d="M300 352 C 338 326, 386 320, 432 328 L 432 486 C 386 478, 338 484, 300 510 Z" fill="#e9e1d3" stroke-width="5" stroke-linejoin="round"/></g>
    <path d="M300 352 V510" stroke="var(--teal-d)" stroke-width="5" stroke-linecap="round"/>
    <path d="M362 340 V392 L374 380 L386 392 V336" fill="var(--terra)"/>
  </g>
  <path class="arc" style="stroke:var(--brass);animation-delay:1.2s" d="M262 300 A 44 44 0 0 1 338 300"/>
  <path class="arc" style="stroke:var(--sage);animation-delay:1.6s" d="M236 270 A 78 78 0 0 1 364 270"/>
  <path class="arc" style="stroke:var(--teal);animation-delay:2s" d="M210 240 A 112 112 0 0 1 390 240"/>
  <text class="name txt" style="animation-delay:1.3s" x="300" y="630" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="100" font-weight="600" letter-spacing="1">Leia<tspan class="accent">Me</tspan></text>
</svg>
